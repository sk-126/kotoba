<title>Kotoba JLPT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Shippori+Mincho+B1:wght@500;700;800&display=swap">
<style>
/* Layout: left rail nav on desktop, bottom tabs on phones. Learn = zigzag lesson path + sticky daily card. Lessons are full-screen. */
:root{--bg:#f4f5f9;--surface:#ffffff;--soft:#eceef7;--ink:#12152b;--mute:#5c6283;--line:#e2e5f0;--pri:#2d3fb8;--pri-d:#1f2d8a;--on-pri:#ffffff;--hot:#d9432f;--on-hot:#ffffff;--ok:#16875f;--ok-d:#0e5f43;--on-ok:#ffffff;--ok-bg:#ddf3e8;--bad:#c8344a;--bad-d:#8f2335;--on-bad:#ffffff;--bad-bg:#fbe3e7;--gold:#b7861b;--on-gold:#ffffff;--shadow:0 1px 2px rgba(18,21,43,.05),0 12px 32px -12px rgba(18,21,43,.14);--f-ui:"Zen Kaku Gothic New","Noto Sans JP",system-ui,sans-serif;--f-jp:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;--f-disp:"Shippori Mincho B1","Noto Serif JP","Hiragino Mincho ProN",serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f1a;--surface:#161929;--soft:#1e2238;--ink:#eceef8;--mute:#9ba1c4;--line:#272c48;--pri:#8c9bff;--pri-d:#4e5fe0;--on-pri:#0d0f1a;--hot:#ff7a66;--on-hot:#2a0a05;--ok:#3ccf95;--ok-d:#1f8460;--on-ok:#04221a;--ok-bg:#12372b;--bad:#ff6b80;--bad-d:#b32f45;--on-bad:#2a0610;--bad-bg:#401a26;--gold:#f2c14e;--on-gold:#2a1d00;--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -12px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0f1a;--surface:#161929;--soft:#1e2238;--ink:#eceef8;--mute:#9ba1c4;--line:#272c48;--pri:#8c9bff;--pri-d:#4e5fe0;--on-pri:#0d0f1a;--hot:#ff7a66;--on-hot:#2a0a05;--ok:#3ccf95;--ok-d:#1f8460;--on-ok:#04221a;--ok-bg:#12372b;--bad:#ff6b80;--bad-d:#b32f45;--on-bad:#2a0610;--bad-bg:#401a26;--gold:#f2c14e;--on-gold:#2a1d00;--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -12px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--pri)}
:focus-visible{outline:3px solid color-mix(in srgb,var(--pri) 55%,transparent);outline-offset:2px}
.jp{font-family:var(--f-jp)}
svg{display:block}
h1,h2,h3{text-wrap:balance}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.nav .brand{display:none}
.nav button{flex:1;min-width:0;height:64px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;color:var(--mute)}
.nav button.on{color:var(--pri)}
.nav svg{width:24px;height:24px}
.nav .kj{font-size:20px;line-height:24px;font-weight:700}
main{padding-block:16px 96px;min-width:0}
.wrap{max-width:760px;margin:0 auto;display:grid;gap:16px}
.learn{max-width:980px;margin:0 auto;display:grid;gap:18px}
.path{min-width:0}
@media(min-width:900px){
 body{padding-left:calc(232px + 24px);padding-right:24px}
 .nav{top:0;bottom:auto;right:auto;width:232px;height:100vh;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:22px 14px;gap:6px}
 .nav .brand{display:flex;align-items:center;gap:12px;font-weight:900;font-size:20px;margin-bottom:18px;padding:0 8px}
 .logo{width:40px;height:40px;border-radius:12px;background:var(--hot);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:700;transform:rotate(-4deg)}
 .nav button{flex:none;height:auto;flex-direction:row;justify-content:flex-start;gap:14px;padding:12px 14px;border-radius:14px;font-size:14px;letter-spacing:.06em;text-transform:uppercase;border:2px solid transparent}
 .nav button.on{background:color-mix(in srgb,var(--pri) 10%,transparent);border-color:color-mix(in srgb,var(--pri) 35%,transparent)}
 main{padding-bottom:40px}
 .learn{grid-template-columns:minmax(0,1fr) 300px}
 .path{grid-column:1;grid-row:1}
 .rail{grid-column:2;grid-row:1;position:sticky;top:20px;align-self:start;display:grid;gap:16px}
}
.rail{display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.h1{font-size:30px;font-weight:900;line-height:1.15}
.sub{color:var(--mute)}
.mut{color:var(--mute);font-size:13px}
/* buttons */
.btn{--c:var(--pri);--d:var(--pri-d);border:0;background:var(--c);color:#fff;border-radius:14px;padding:14px 22px;font-weight:900;font-size:14px;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 4px 0 var(--d);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--d)}
.btn:disabled{background:var(--line);color:var(--mute);box-shadow:0 4px 0 color-mix(in srgb,var(--line) 75%,#000);cursor:not-allowed}
.btn.okb{--c:var(--ok);--d:var(--ok-d)}.btn.badb{--c:var(--bad);--d:var(--bad-d)}.btn.hot{--c:var(--hot);--d:#a7261c}.btn.block{width:100%}
.ghost{background:none;border:2px solid var(--line);border-radius:14px;padding:12px 18px;font-weight:800;color:var(--mute);text-transform:uppercase;font-size:13px;letter-spacing:.06em}
/* today card */
.trow{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.ringw{position:relative;width:64px;height:64px;flex:none}
.ringw svg{width:64px;height:64px}
.ringw span{position:absolute;inset:0;display:grid;place-items:center;color:var(--gold);font-size:22px}
.big{font-size:26px;font-weight:900;line-height:1.1}.big small{font-size:14px;color:var(--mute);font-weight:700}
.streak{margin-left:auto;display:flex;align-items:center;gap:4px;color:var(--hot);font-size:22px;font-weight:900}
.kod{width:100%;display:flex;align-items:center;gap:14px;text-align:left;border:0;background:none;padding:0}
.kbig{font-size:54px;line-height:1;width:72px;height:72px;border-radius:16px;background:color-mix(in srgb,var(--pri) 10%,var(--surface));display:grid;place-items:center;flex:none}
.kod b{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
/* path */
.unit{margin-bottom:6px}
.c0{--u:#3446d6;--ud:#222f9c}.c1{--u:#0f8a8a;--ud:#0a6262}.c2{--u:#8b3fa8;--ud:#632a79}.c3{--u:#d4432f;--ud:#a2301f}.c4{--u:#a86a00;--ud:#7c4e00}
.ubanner{background:var(--u);color:#fff;border-radius:18px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.ukick{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.ubanner h2{font-size:24px;font-weight:900;line-height:1.2}
.ubanner p{font-size:14px;opacity:.92}
.ghostw{flex:none;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.55);color:#fff;border-radius:12px;padding:8px 12px;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.nodes{display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 0 22px}
.nw{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px}
.node{position:relative;width:74px;height:74px;border-radius:50%;border:0;background:var(--u);color:#fff;box-shadow:0 6px 0 var(--ud);display:grid;place-items:center;font-size:30px;font-weight:700}
.node svg{width:30px;height:30px}
.node.done{background:var(--gold);box-shadow:0 6px 0 #a87800;color:#fff}
.node.lock{background:var(--line);color:var(--mute);box-shadow:0 6px 0 color-mix(in srgb,var(--line) 70%,#000)}
.node:active:not(.lock){transform:translateY(4px);box-shadow:0 2px 0 var(--ud)}
.node.cur::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:4px solid var(--u);opacity:.35;animation:pulse 1.8s ease-out infinite}
.nl{font-size:13px;font-weight:700;color:var(--mute);max-width:130px;text-align:center}
.stars{color:var(--gold);font-size:13px;letter-spacing:2px;line-height:1}
.bub{position:absolute;top:-34px;left:50%;transform:translateX(-50%);background:var(--surface);color:var(--u);border:2px solid var(--line);border-radius:10px;padding:3px 10px;font-weight:900;font-size:12px;letter-spacing:.08em;text-transform:uppercase;animation:bob 1.4s ease-in-out infinite}
@keyframes pulse{0%{transform:scale(.92);opacity:.5}100%{transform:scale(1.18);opacity:0}}
@keyframes bob{50%{transform:translateX(-50%) translateY(-4px)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* generic sections */
.seg{display:inline-flex;background:var(--line);border-radius:14px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:8px 16px;border-radius:10px;font-weight:800;color:var(--mute)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-weight:800;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip.on{border-color:var(--pri);color:var(--pri)}
.chip.lk{opacity:.45}
.search{display:flex;gap:10px}
.search input{flex:1;min-width:0;font:inherit;font-size:18px;padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px}
.kc{aspect-ratio:1;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:var(--surface);font-size:28px;display:grid;place-items:center}
.kc:hover{border-color:var(--pri)}
.chart{display:grid;gap:8px}
.crow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cell{border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:var(--surface);padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:0}
.cell .jp{font-size:30px;line-height:1.2}.cell small{color:var(--mute);font-weight:700;font-size:13px}
.cell.m{border-color:var(--ok);background:var(--ok-bg)}
.cell.e{visibility:hidden}
.sec{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-top:8px}
.stat3{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.st b{display:block;font-size:28px;font-weight:900;line-height:1.1}.st span{font-size:13px;color:var(--mute);font-weight:700}
.bars{display:flex;align-items:flex-end;gap:10px;height:130px;padding-top:8px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;min-width:0}
.bar i{width:100%;max-width:40px;background:var(--pri);border-radius:8px 8px 3px 3px;min-height:4px}
.bar.t i{background:var(--hot)}.bar span{font-size:12px;color:var(--mute);font-weight:700}
.bar em{font-size:11px;font-style:normal;color:var(--mute);font-variant-numeric:tabular-nums}
.lv{height:10px;border-radius:99px;background:var(--line);overflow:hidden}.lv i{display:block;height:100%;background:var(--pri)}
.dist{display:grid;gap:8px}
.drow{display:grid;grid-template-columns:110px 1fr 44px;gap:10px;align-items:center;font-size:14px;font-weight:700}
.drow div{height:12px;border-radius:99px;background:var(--line);overflow:hidden}.drow i{display:block;height:100%;background:var(--ok)}
.bd{display:flex;align-items:center;gap:10px}
.lock-t{opacity:.5}
/* session */
#ses{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#ses.on{display:flex}
.shead{display:flex;align-items:center;gap:14px;max-width:720px;width:100%;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.x{border:0;background:none;font-size:32px;line-height:1;color:var(--mute);width:36px;height:36px}
.sp{flex:1;height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.sp i{display:block;height:100%;border-radius:99px;background:var(--ok);transition:width .35s;background-image:linear-gradient(180deg,rgba(255,255,255,.35),transparent 60%)}
.sbody{flex:1;overflow:auto;max-width:720px;width:100%;margin:0 auto;padding:10px max(18px,env(safe-area-inset-right,0px)) 24px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.lab{font-size:24px;font-weight:900;line-height:1.2}
.prompt{display:flex;align-items:center;gap:12px}
.prompt.big{font-family:var(--f-jp);font-size:88px;line-height:1.1;justify-content:center;padding:6px 0}
.prompt.mid{font-family:var(--f-jp);font-size:30px;line-height:1.4;justify-content:center;text-align:center}
.prompt.lat{font-size:44px;font-weight:900;justify-content:center;text-align:center}
.mini{border:2px solid var(--line);background:var(--surface);border-radius:12px;width:46px;height:46px;font-size:22px;color:var(--pri);display:grid;place-items:center;flex:none}
.mini svg{width:22px;height:22px}
.lis{display:flex;justify-content:center;align-items:center;gap:14px;padding:12px 0}
.sp-big{width:112px;height:112px;border-radius:28px;border:0;background:var(--pri);color:#fff;box-shadow:0 6px 0 var(--pri-d);display:grid;place-items:center}
.sp-big svg{width:48px;height:48px}
.sp-slow{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.05em}
.opts{display:grid;gap:10px}.opts.g2{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:14px 16px;font-size:20px;font-weight:700;min-width:0}
.opt b{width:28px;height:28px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font-size:13px;color:var(--mute);flex:none}
.opt span{min-width:0;overflow-wrap:anywhere}
.opt.sel{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 10%,var(--surface))}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.ti{width:100%;font:inherit;font-size:22px;font-weight:700;padding:16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.ti:focus{border-color:var(--pri)}
.bubble{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 16px;font-size:20px;font-weight:700}
.answerline{display:flex;flex-wrap:wrap;gap:8px;min-height:68px;padding:10px 0;border-top:2px solid var(--line);border-bottom:2px solid var(--line);align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tok{font-family:var(--f-jp);border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:12px;padding:8px 14px;font-size:22px;font-weight:500}
.tok.gh{opacity:.25;pointer-events:none}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mt .col{display:grid;gap:10px;align-content:start}
.mb{justify-content:center;text-align:center;min-height:60px}
.mb.gone{visibility:hidden}.mb.fl{animation:shake .35s;border-color:var(--bad)}
.introc{margin:auto 0;text-align:center;display:grid;gap:10px;justify-items:center}
.introc .jp.h{font-size:112px;line-height:1.1}.introc .r{font-size:34px;font-weight:900;color:var(--pri)}.introc .e{font-size:20px;color:var(--mute);font-weight:700}
.tipc{text-align:left;max-width:520px}.tipc ul{padding-left:20px;display:grid;gap:8px;margin-top:10px;font-size:18px}
.sbar{border-top:2px solid var(--line);background:var(--surface)}
.sbar .in{max-width:720px;margin:0 auto;padding:14px max(18px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;justify-content:space-between;align-items:center;gap:12px}
.sbar.good{background:var(--ok-bg);border-color:transparent}.sbar.bad{background:var(--bad-bg);border-color:transparent}
.fb{display:flex;gap:12px;align-items:center;min-width:0}
.fbi{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);flex:none}
.fbi svg{width:24px;height:24px}
.good .fbi,.good .fbt{color:var(--ok-d)}.bad .fbi,.bad .fbt{color:var(--bad-d)}
:root[data-theme="dark"] .good .fbt,:root[data-theme="dark"] .good .fbi{color:var(--ok)}
:root[data-theme="dark"] .bad .fbt,:root[data-theme="dark"] .bad .fbi{color:var(--bad)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .good .fbt,:root:not([data-theme="light"]) .good .fbi{color:var(--ok)}:root:not([data-theme="light"]) .bad .fbt,:root:not([data-theme="light"]) .bad .fbi{color:var(--bad)}}
.fbt{font-weight:900;font-size:20px;line-height:1.2}.fbs{font-size:14px;overflow-wrap:anywhere}
.donew{margin:auto;text-align:center;display:grid;gap:18px;max-width:440px;width:100%}
.donew .big2{font-size:34px;font-weight:900}
.dstars{color:var(--gold);font-size:40px;letter-spacing:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sta{border:2px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
.sta b{display:block;padding:4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#fff}
.sta span{display:block;padding:12px 4px;font-size:22px;font-weight:900}
.conf i{position:fixed;top:-14px;left:var(--x);width:8px;height:14px;background:var(--c);animation:fall var(--d) linear forwards;z-index:70;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.qm{position:fixed;inset:0;background:rgba(10,12,30,.6);display:grid;place-items:center;z-index:75;padding:16px}
.qm .card{max-width:380px;display:grid;gap:12px}
/* modal */
#modal{display:none;position:fixed;inset:0;z-index:80}#modal.on{display:block}
.scrim{position:absolute;inset:0;background:rgba(10,12,30,.6)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;display:grid;gap:14px}
@media(min-width:700px){.sheet{bottom:auto;top:50%;transform:translateY(-50%);border-radius:24px}}
.x2{position:absolute;top:10px;right:14px;border:0;background:none;font-size:30px;color:var(--mute)}
.kdet{display:flex;gap:16px;align-items:center}
.kdet .jp{font-size:96px;line-height:1}
.kv dt{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}.kv dd{margin:0 0 8px;font-size:17px;font-weight:700}
.words{list-style:none;padding:0;display:grid;gap:6px;font-size:15px}.words .jp{font-size:18px;font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:99;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.prompt span{white-space:pre-line}
.prompt.sm{font-family:var(--f-jp);font-size:24px;line-height:1.6;justify-content:center;text-align:center}
