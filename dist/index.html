<title>Kotoba JLPT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Shippori+Mincho+B1:wght@500;700;800&display=swap">
<style>
/* Layout: left rail nav on desktop, bottom tabs on phones. Learn = zigzag lesson path + sticky daily card. Lessons are full-screen. */
:root{--bg:#f4f5f9;--surface:#ffffff;--soft:#eceef7;--ink:#12152b;--mute:#5c6283;--line:#e2e5f0;--pri:#2d3fb8;--pri-d:#1f2d8a;--on-pri:#ffffff;--hot:#d9432f;--on-hot:#ffffff;--ok:#16875f;--ok-d:#0e5f43;--on-ok:#ffffff;--ok-bg:#ddf3e8;--bad:#c8344a;--bad-d:#8f2335;--on-bad:#ffffff;--bad-bg:#fbe3e7;--gold:#b7861b;--on-gold:#ffffff;--shadow:0 1px 2px rgba(18,21,43,.05),0 12px 32px -12px rgba(18,21,43,.14);--f-ui:"Zen Kaku Gothic New","Noto Sans JP",system-ui,sans-serif;--f-jp:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;--f-disp:"Shippori Mincho B1","Noto Serif JP","Hiragino Mincho ProN",serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f1a;--surface:#161929;--soft:#1e2238;--ink:#eceef8;--mute:#9ba1c4;--line:#272c48;--pri:#8c9bff;--pri-d:#4e5fe0;--on-pri:#0d0f1a;--hot:#ff7a66;--on-hot:#2a0a05;--ok:#3ccf95;--ok-d:#1f8460;--on-ok:#04221a;--ok-bg:#12372b;--bad:#ff6b80;--bad-d:#b32f45;--on-bad:#2a0610;--bad-bg:#401a26;--gold:#f2c14e;--on-gold:#2a1d00;--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -12px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0f1a;--surface:#161929;--soft:#1e2238;--ink:#eceef8;--mute:#9ba1c4;--line:#272c48;--pri:#8c9bff;--pri-d:#4e5fe0;--on-pri:#0d0f1a;--hot:#ff7a66;--on-hot:#2a0a05;--ok:#3ccf95;--ok-d:#1f8460;--on-ok:#04221a;--ok-bg:#12372b;--bad:#ff6b80;--bad-d:#b32f45;--on-bad:#2a0610;--bad-bg:#401a26;--gold:#f2c14e;--on-gold:#2a1d00;--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -12px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--pri)}
:focus-visible{outline:3px solid color-mix(in srgb,var(--pri) 55%,transparent);outline-offset:2px}
.jp{font-family:var(--f-jp)}
svg{display:block}
h1,h2,h3{text-wrap:balance}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.nav .brand{display:none}
.nav button{flex:1;min-width:0;height:64px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;color:var(--mute)}
.nav button.on{color:var(--pri)}
.nav svg{width:24px;height:24px}
.nav .kj{font-size:20px;line-height:24px;font-weight:700}
main{padding-block:16px 96px;min-width:0}
.wrap{max-width:760px;margin:0 auto;display:grid;gap:16px}
.learn{max-width:980px;margin:0 auto;display:grid;gap:18px}
.path{min-width:0}
@media(min-width:900px){
 body{padding-left:calc(232px + 24px);padding-right:24px}
 .nav{top:0;bottom:auto;right:auto;width:232px;height:100vh;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:22px 14px;gap:6px}
 .nav .brand{display:flex;align-items:center;gap:12px;font-weight:900;font-size:20px;margin-bottom:18px;padding:0 8px}
 .logo{width:40px;height:40px;border-radius:12px;background:var(--hot);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:700;transform:rotate(-4deg)}
 .nav button{flex:none;height:auto;flex-direction:row;justify-content:flex-start;gap:14px;padding:12px 14px;border-radius:14px;font-size:14px;letter-spacing:.06em;text-transform:uppercase;border:2px solid transparent}
 .nav button.on{background:color-mix(in srgb,var(--pri) 10%,transparent);border-color:color-mix(in srgb,var(--pri) 35%,transparent)}
 main{padding-bottom:40px}
 .learn{grid-template-columns:minmax(0,1fr) 300px}
 .path{grid-column:1;grid-row:1}
 .rail{grid-column:2;grid-row:1;position:sticky;top:20px;align-self:start;display:grid;gap:16px}
}
.rail{display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.h1{font-size:30px;font-weight:900;line-height:1.15}
.sub{color:var(--mute)}
.mut{color:var(--mute);font-size:13px}
/* buttons */
.btn{--c:var(--pri);--d:var(--pri-d);border:0;background:var(--c);color:#fff;border-radius:14px;padding:14px 22px;font-weight:900;font-size:14px;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 4px 0 var(--d);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--d)}
.btn:disabled{background:var(--line);color:var(--mute);box-shadow:0 4px 0 color-mix(in srgb,var(--line) 75%,#000);cursor:not-allowed}
.btn.okb{--c:var(--ok);--d:var(--ok-d)}.btn.badb{--c:var(--bad);--d:var(--bad-d)}.btn.hot{--c:var(--hot);--d:#a7261c}.btn.block{width:100%}
.ghost{background:none;border:2px solid var(--line);border-radius:14px;padding:12px 18px;font-weight:800;color:var(--mute);text-transform:uppercase;font-size:13px;letter-spacing:.06em}
/* today card */
.trow{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.ringw{position:relative;width:64px;height:64px;flex:none}
.ringw svg{width:64px;height:64px}
.ringw span{position:absolute;inset:0;display:grid;place-items:center;color:var(--gold);font-size:22px}
.big{font-size:26px;font-weight:900;line-height:1.1}.big small{font-size:14px;color:var(--mute);font-weight:700}
.streak{margin-left:auto;display:flex;align-items:center;gap:4px;color:var(--hot);font-size:22px;font-weight:900}
.kod{width:100%;display:flex;align-items:center;gap:14px;text-align:left;border:0;background:none;padding:0}
.kbig{font-size:54px;line-height:1;width:72px;height:72px;border-radius:16px;background:color-mix(in srgb,var(--pri) 10%,var(--surface));display:grid;place-items:center;flex:none}
.kod b{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
/* path */
.unit{margin-bottom:6px}
.c0{--u:#3446d6;--ud:#222f9c}.c1{--u:#0f8a8a;--ud:#0a6262}.c2{--u:#8b3fa8;--ud:#632a79}.c3{--u:#d4432f;--ud:#a2301f}.c4{--u:#a86a00;--ud:#7c4e00}
.ubanner{background:var(--u);color:#fff;border-radius:18px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.ukick{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.ubanner h2{font-size:24px;font-weight:900;line-height:1.2}
.ubanner p{font-size:14px;opacity:.92}
.ghostw{flex:none;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.55);color:#fff;border-radius:12px;padding:8px 12px;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.nodes{display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 0 22px}
.nw{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px}
.node{position:relative;width:74px;height:74px;border-radius:50%;border:0;background:var(--u);color:#fff;box-shadow:0 6px 0 var(--ud);display:grid;place-items:center;font-size:30px;font-weight:700}
.node svg{width:30px;height:30px}
.node.done{background:var(--gold);box-shadow:0 6px 0 #a87800;color:#fff}
.node.lock{background:var(--line);color:var(--mute);box-shadow:0 6px 0 color-mix(in srgb,var(--line) 70%,#000)}
.node:active:not(.lock){transform:translateY(4px);box-shadow:0 2px 0 var(--ud)}
.node.cur::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:4px solid var(--u);opacity:.35;animation:pulse 1.8s ease-out infinite}
.nl{font-size:13px;font-weight:700;color:var(--mute);max-width:130px;text-align:center}
.stars{color:var(--gold);font-size:13px;letter-spacing:2px;line-height:1}
.bub{position:absolute;top:-34px;left:50%;transform:translateX(-50%);background:var(--surface);color:var(--u);border:2px solid var(--line);border-radius:10px;padding:3px 10px;font-weight:900;font-size:12px;letter-spacing:.08em;text-transform:uppercase;animation:bob 1.4s ease-in-out infinite}
@keyframes pulse{0%{transform:scale(.92);opacity:.5}100%{transform:scale(1.18);opacity:0}}
@keyframes bob{50%{transform:translateX(-50%) translateY(-4px)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* generic sections */
.seg{display:inline-flex;background:var(--line);border-radius:14px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:8px 16px;border-radius:10px;font-weight:800;color:var(--mute)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-weight:800;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip.on{border-color:var(--pri);color:var(--pri)}
.chip.lk{opacity:.45}
.search{display:flex;gap:10px}
.search input{flex:1;min-width:0;font:inherit;font-size:18px;padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px}
.kc{aspect-ratio:1;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:var(--surface);font-size:28px;display:grid;place-items:center}
.kc:hover{border-color:var(--pri)}
.chart{display:grid;gap:8px}
.crow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cell{border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:var(--surface);padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:0}
.cell .jp{font-size:30px;line-height:1.2}.cell small{color:var(--mute);font-weight:700;font-size:13px}
.cell.m{border-color:var(--ok);background:var(--ok-bg)}
.cell.e{visibility:hidden}
.sec{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-top:8px}
.stat3{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.st b{display:block;font-size:28px;font-weight:900;line-height:1.1}.st span{font-size:13px;color:var(--mute);font-weight:700}
.bars{display:flex;align-items:flex-end;gap:10px;height:130px;padding-top:8px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;min-width:0}
.bar i{width:100%;max-width:40px;background:var(--pri);border-radius:8px 8px 3px 3px;min-height:4px}
.bar.t i{background:var(--hot)}.bar span{font-size:12px;color:var(--mute);font-weight:700}
.bar em{font-size:11px;font-style:normal;color:var(--mute);font-variant-numeric:tabular-nums}
.lv{height:10px;border-radius:99px;background:var(--line);overflow:hidden}.lv i{display:block;height:100%;background:var(--pri)}
.dist{display:grid;gap:8px}
.drow{display:grid;grid-template-columns:110px 1fr 44px;gap:10px;align-items:center;font-size:14px;font-weight:700}
.drow div{height:12px;border-radius:99px;background:var(--line);overflow:hidden}.drow i{display:block;height:100%;background:var(--ok)}
.bd{display:flex;align-items:center;gap:10px}
.lock-t{opacity:.5}
/* session */
#ses{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#ses.on{display:flex}
.shead{display:flex;align-items:center;gap:14px;max-width:720px;width:100%;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.x{border:0;background:none;font-size:32px;line-height:1;color:var(--mute);width:36px;height:36px}
.sp{flex:1;height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.sp i{display:block;height:100%;border-radius:99px;background:var(--ok);transition:width .35s;background-image:linear-gradient(180deg,rgba(255,255,255,.35),transparent 60%)}
.sbody{flex:1;overflow:auto;max-width:720px;width:100%;margin:0 auto;padding:10px max(18px,env(safe-area-inset-right,0px)) 24px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.lab{font-size:24px;font-weight:900;line-height:1.2}
.prompt{display:flex;align-items:center;gap:12px}
.prompt.big{font-family:var(--f-jp);font-size:88px;line-height:1.1;justify-content:center;padding:6px 0}
.prompt.mid{font-family:var(--f-jp);font-size:30px;line-height:1.4;justify-content:center;text-align:center}
.prompt.lat{font-size:44px;font-weight:900;justify-content:center;text-align:center}
.mini{border:2px solid var(--line);background:var(--surface);border-radius:12px;width:46px;height:46px;font-size:22px;color:var(--pri);display:grid;place-items:center;flex:none}
.mini svg{width:22px;height:22px}
.lis{display:flex;justify-content:center;align-items:center;gap:14px;padding:12px 0}
.sp-big{width:112px;height:112px;border-radius:28px;border:0;background:var(--pri);color:#fff;box-shadow:0 6px 0 var(--pri-d);display:grid;place-items:center}
.sp-big svg{width:48px;height:48px}
.sp-slow{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.05em}
.opts{display:grid;gap:10px}.opts.g2{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:14px 16px;font-size:20px;font-weight:700;min-width:0}
.opt b{width:28px;height:28px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font-size:13px;color:var(--mute);flex:none}
.opt span{min-width:0;overflow-wrap:anywhere}
.opt.sel{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 10%,var(--surface))}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.ti{width:100%;font:inherit;font-size:22px;font-weight:700;padding:16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.ti:focus{border-color:var(--pri)}
.bubble{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 16px;font-size:20px;font-weight:700}
.answerline{display:flex;flex-wrap:wrap;gap:8px;min-height:68px;padding:10px 0;border-top:2px solid var(--line);border-bottom:2px solid var(--line);align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tok{font-family:var(--f-jp);border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:12px;padding:8px 14px;font-size:22px;font-weight:500}
.tok.gh{opacity:.25;pointer-events:none}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mt .col{display:grid;gap:10px;align-content:start}
.mb{justify-content:center;text-align:center;min-height:60px}
.mb.gone{visibility:hidden}.mb.fl{animation:shake .35s;border-color:var(--bad)}
.introc{margin:auto 0;text-align:center;display:grid;gap:10px;justify-items:center}
.introc .jp.h{font-size:112px;line-height:1.1}.introc .r{font-size:34px;font-weight:900;color:var(--pri)}.introc .e{font-size:20px;color:var(--mute);font-weight:700}
.tipc{text-align:left;max-width:520px}.tipc ul{padding-left:20px;display:grid;gap:8px;margin-top:10px;font-size:18px}
.sbar{border-top:2px solid var(--line);background:var(--surface)}
.sbar .in{max-width:720px;margin:0 auto;padding:14px max(18px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;justify-content:space-between;align-items:center;gap:12px}
.sbar.good{background:var(--ok-bg);border-color:transparent}.sbar.bad{background:var(--bad-bg);border-color:transparent}
.fb{display:flex;gap:12px;align-items:center;min-width:0}
.fbi{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);flex:none}
.fbi svg{width:24px;height:24px}
.good .fbi,.good .fbt{color:var(--ok-d)}.bad .fbi,.bad .fbt{color:var(--bad-d)}
:root[data-theme="dark"] .good .fbt,:root[data-theme="dark"] .good .fbi{color:var(--ok)}
:root[data-theme="dark"] .bad .fbt,:root[data-theme="dark"] .bad .fbi{color:var(--bad)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .good .fbt,:root:not([data-theme="light"]) .good .fbi{color:var(--ok)}:root:not([data-theme="light"]) .bad .fbt,:root:not([data-theme="light"]) .bad .fbi{color:var(--bad)}}
.fbt{font-weight:900;font-size:20px;line-height:1.2}.fbs{font-size:14px;overflow-wrap:anywhere}
.donew{margin:auto;text-align:center;display:grid;gap:18px;max-width:440px;width:100%}
.donew .big2{font-size:34px;font-weight:900}
.dstars{color:var(--gold);font-size:40px;letter-spacing:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sta{border:2px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
.sta b{display:block;padding:4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#fff}
.sta span{display:block;padding:12px 4px;font-size:22px;font-weight:900}
.conf i{position:fixed;top:-14px;left:var(--x);width:8px;height:14px;background:var(--c);animation:fall var(--d) linear forwards;z-index:70;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.qm{position:fixed;inset:0;background:rgba(10,12,30,.6);display:grid;place-items:center;z-index:75;padding:16px}
.qm .card{max-width:380px;display:grid;gap:12px}
/* modal */
#modal{display:none;position:fixed;inset:0;z-index:80}#modal.on{display:block}
.scrim{position:absolute;inset:0;background:rgba(10,12,30,.6)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;display:grid;gap:14px}
@media(min-width:700px){.sheet{bottom:auto;top:50%;transform:translateY(-50%);border-radius:24px}}
.x2{position:absolute;top:10px;right:14px;border:0;background:none;font-size:30px;color:var(--mute)}
.kdet{display:flex;gap:16px;align-items:center}
.kdet .jp{font-size:96px;line-height:1}
.kv dt{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}.kv dd{margin:0 0 8px;font-size:17px;font-weight:700}
.words{list-style:none;padding:0;display:grid;gap:6px;font-size:15px}.words .jp{font-size:18px;font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:99;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.prompt span{white-space:pre-line}
.prompt.sm{font-family:var(--f-jp);font-size:24px;line-height:1.6;justify-content:center;text-align:center}

/* ===== Kotoba identity: washi paper (light) / midnight hanami (dark). Tokens first, then motion. ===== */
:root{--bg:#f7f2ec;--surface:#fffdfa;--soft:#efe7de;--ink:#1d1727;--mute:#675d73;--line:#e6dccf;--pri:#c2331f;--pri-d:#8f2214;--on-pri:#ffffff;--hot:#d63a72;--on-hot:#ffffff;--ok:#127751;--ok-d:#0b563a;--on-ok:#ffffff;--ok-bg:#dcf2e6;--bad:#c0273f;--bad-d:#8c1a2c;--on-bad:#ffffff;--bad-bg:#fbe2e6;--gold:#a8700a;--on-gold:#ffffff;--ink2:#2b2147;--glow1:#ffb8a3;--glow2:#c9b6ff;--glow3:#ffd9a0;--shadow:0 1px 2px rgba(29,23,39,.05),0 18px 40px -18px rgba(60,30,40,.22)}

:root[data-theme="dark"]{--bg:#0a0912;--surface:#15131f;--soft:#1f1c2e;--ink:#f3eefa;--mute:#a79fb9;--line:#2b2742;--pri:#ff7f66;--pri-d:#d4472f;--on-pri:#220a04;--hot:#ff6fa0;--on-hot:#2b0615;--ok:#44d49a;--ok-d:#1f8460;--on-ok:#04221a;--ok-bg:#12372b;--bad:#ff6b82;--bad-d:#b32f45;--on-bad:#2a0610;--bad-bg:#3f1a27;--gold:#f4c25b;--on-gold:#2a1d00;--ink2:#cfc3ff;--glow1:#7a2f4f;--glow2:#3d2f8a;--glow3:#6b4a1c;--shadow:0 1px 2px rgba(0,0,0,.5),0 18px 40px -18px rgba(0,0,0,.65);color-scheme:dark}

/* living background: three slow aurora blobs behind everything */
body::before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;background:radial-gradient(40% 35% at 15% 10%,var(--glow1),transparent 70%),radial-gradient(38% 34% at 88% 18%,var(--glow2),transparent 70%),radial-gradient(45% 40% at 60% 100%,var(--glow3),transparent 70%);opacity:.55;animation:aurora 26s ease-in-out infinite alternate}
@keyframes aurora{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(2%,-2%,0) scale(1.06)}100%{transform:translate3d(-2%,2%,0) scale(1.02)}}

/* glass surfaces */
.card{background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px) saturate(1.2);-webkit-backdrop-filter:blur(10px) saturate(1.2);border-color:color-mix(in srgb,var(--line) 80%,transparent)}

/* primary buttons: vermilion to sakura gradient with a slow sheen */
.btn{position:relative;overflow:hidden;background:linear-gradient(120deg,var(--c),color-mix(in srgb,var(--c) 70%,var(--hot)))}

.btn:disabled{background:var(--line)}

/* page and card entrance */
.pg>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}

function toRomaji(s){
 s=s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
 let out='',dbl=false;
 for(const ch of s){
  if(ch==='っ'){dbl=true;continue}
  if(ch==='ー'){out+=out.slice(-1);continue}
  if('ゃゅょ'.includes(ch)){const v={'ゃ':'a','ゅ':'u','ょ':'o'}[ch],b=out.slice(0,-1);out=/(sh|ch|j)$/.test(b)?b+v:b+'y'+v;continue}
  let r=RMAP[ch];if(r===undefined){out+=ch;continue}
  if(dbl){r=(r[0]==='c'?'t':r[0])+r;dbl=false}
  out+=r}
 return out}

{title:'N5 Grammar',sub:'24 patterns, each with a short drill',lessons:[
 LG('は and です',['A は B です means "A is B".','は is written は but read "wa".','わたしは がくせいです。 I am a student.'],[
  ["わたしは がくせい＿＿。\n(I am a student.)",["です","ます","ですか","でした"],0,"A noun sentence ends with です."],
  ["これ＿＿ わたしの ほんです。\n(This is my book.)",["は","を","に","で"],0,"は marks the topic of the sentence."],
  ["やまださんは せんせい＿＿。\n(Is Mr. Yamada a teacher?)",["ですか","です","でした","ます"],0,"Add か to turn a statement into a question."]]),
 LG('の for possession',['A の B means "B of A" or "A\'s B".','わたしの ほん = my book','にほんごの ほん = a Japanese-language book'],[
  ["わたし＿＿ ほん\n(my book)",["の","は","を","に"],0,"の links two nouns."],
  ["これは せんせい＿＿ かさです。\n(This is the teacher's umbrella.)",["の","は","を","と"],0,"の shows who owns it."],
  ["にほんご＿＿ ほんを よみます。\n(I read a Japanese-language book.)",["の","を","に","が"],0,"の joins にほんご and ほん."]]),
 LG('も means also',['A も B です means "A is also B".','わたしは がくせいです。ともだちも がくせいです。'],[
  ["わたしは がくせいです。ともだち＿＿ がくせいです。\n(My friend is a student too.)",["も","は","を","の"],0,"も replaces は when you add \"also\"."],
  ["コーヒーを のみます。わたし＿＿ のみます。\n(I drink it too.)",["も","を","に","で"],0,"も means \"too\"."],
  ["これは ペンです。それ＿＿ ペンです。\n(That is also a pen.)",["も","を","に","か"],0,"も marks the added topic."]]),
 LG('か and question words',['Add か at the end to ask a question.','なん = what, だれ = who, どこ = where','トイレは どこですか。 Where is the toilet?'],[
  ["これは なんです＿＿。\n(What is this?)",["か","よ","ね","の"],0,"か makes a question."],
  ["トイレは ＿＿ですか。\n(Where is the toilet?)",["どこ","だれ","いつ","なに"],0,"どこ means where."],
  ["あの ひとは ＿＿ですか。\n(Who is that person?)",["だれ","どこ","いつ","いくら"],0,"だれ means who."]]),
 LG('を marks the object',['を marks what the action is done to.','みずを のみます。 I drink water.'],[
  ["みず＿＿ のみます。\n(I drink water.)",["を","は","に","で"],0,"を marks the object of the verb."],
  ["にほんごの ほん＿＿ よみます。\n(I read a Japanese book.)",["を","に","へ","が"],0,"よみます acts on the book, so を."],
  ["パン＿＿ たべます。\n(I eat bread.)",["を","に","で","と"],0,"The thing eaten takes を."]]),
 LG('に for time and destination',['に marks a point in time: 7じに おきます。','に marks a destination: がっこうに いきます。'],[
  ["7じ＿＿ おきます。\n(I wake up at 7.)",["に","を","で","は"],0,"A clock time takes に."],
  ["あした がっこう＿＿ いきます。\n(I will go to school tomorrow.)",["に","を","で","と"],0,"The destination of いきます takes に."],
  ["にちようび＿＿ ともだちに あいます。\n(I meet a friend on Sunday.)",["に","を","で","が"],0,"A day takes に."]]),
 LG('で for place and means',['で marks where an action happens: としょかんで よみます。','で marks the tool or vehicle: バスで いきます。'],[
  ["としょかん＿＿ ほんを よみます。\n(I read a book at the library.)",["で","に","を","の"],0,"で marks where the action takes place."],
  ["バス＿＿ いきます。\n(I go by bus.)",["で","を","が","も"],0,"で marks the means of transport."],
  ["はし＿＿ たべます。\n(I eat with chopsticks.)",["で","に","を","と"],0,"で marks the tool."]]),
 LG('と for and, with',['A と B means "A and B".','ともだちと いきます。 I go with a friend.'],[
  ["ともだち＿＿ えいがを みます。\n(I watch a movie with a friend.)",["と","を","に","で"],0,"と means with."],
  ["ほん＿＿ ノートを かいました。\n(I bought a book and a notebook.)",["と","を","に","が"],0,"と joins two nouns."],
  ["かぞく＿＿ レストランに いきます。\n(I go to a restaurant with my family.)",["と","を","で","の"],0,"と means with."]]),
 LG('から and まで',['から = from, まで = until, to','9じから 5じまで はたらきます。 I work from 9 to 5.'],[
  ["9じ＿＿ 5じまで はたらきます。\n(I work from 9 to 5.)",["から","まで","に","で"],0,"から marks the start."],
  ["げつようびから きんようび＿＿ はたらきます。\n(I work Monday to Friday.)",["まで","から","に","を"],0,"まで marks the end."],
  ["うち＿＿ がっこうまで あるきます。\n(I walk from home to school.)",["から","まで","を","が"],0,"から marks where you start."]]),
 LG('ます form (present)',['Polite present: たべます, のみます, いきます','Negative: たべません','Verbs ending in ます are polite and used for habits and the future.'],[
  ["まいあさ コーヒーを のみ＿＿。\n(I drink coffee every morning.)",["ます","ません","ました","ましょう"],0,"A habit uses the present ます form."],
  ["わたしは さかなを たべ＿＿。\n(I do not eat fish.)",["ません","ます","ました","ましょう"],0,"ません makes it negative."],
  ["あした ともだちに あい＿＿。\n(I will meet a friend tomorrow.)",["ます","ません","ました","ませんでした"],0,"Future plans use ます."]]),
 LG('Past tense: ました',['Past: たべました','Past negative: たべませんでした'],[
  ["きのう えいがを み＿＿。\n(I watched a movie yesterday.)",["ました","ます","ません","ましょう"],0,"Yesterday needs the past form ました."],
  ["けさ あさごはんを たべ＿＿。\n(I did not eat breakfast this morning.)",["ませんでした","ません","ました","ます"],0,"ませんでした is the past negative."],
  ["せんしゅう がっこうに いき＿＿。\n(I did not go to school last week.)",["ませんでした","ません","ました","ます"],0,"Last week plus not going means ませんでした."]]),
 LG('ましょう and ませんか',['Let us: いきましょう','Would you like to: いきませんか','Both invite someone to do something together.'],[
  ["いっしょに ひるごはんを たべ＿＿。\n(Won't you eat lunch with me?)",["ませんか","ました","ません","ます"],0,"ませんか is a polite invitation."],
  ["さあ、うちへ かえり＿＿。\n(Come on, let's go home.)",["ましょう","ません","ました","ますか"],0,"ましょう means let us."],
  ["あした えいがを みに いき＿＿。\n(Let's go see a movie tomorrow.)",["ましょう","ませんでした","ました","ません"],0,"ましょう suggests doing it together."]]),
 LG('たい for wanting',['Verb stem + たいです means "I want to".','すしを たべたいです。 I want to eat sushi.','Negative: たくないです'],[
  ["わたしは すしを たべ＿＿。\n(I want to eat sushi.)",["たいです","ますです","たくです","ましたい"],0,"Stem + たいです expresses want."],
  ["きょうは どこにも いき＿＿。\n(I don't want to go anywhere today.)",["たくないです","たいないです","たくません","ませんたい"],0,"Negative of たい is たくない."],
  ["なにを のみ＿＿か。\n(What do you want to drink?)",["たいです","たくです","ますです","ましたい"],0,"たいですか asks what someone wants."]]),
 LG('ている for ongoing actions',['Verb て-form + います means "is doing".','いま テレビを みています。 I am watching TV now.','It also shows a state: すんでいます = lives'],[
  ["いま テレビを み＿＿。\n(I am watching TV now.)",["ています","ていません","ました","たいです"],0,"ています shows an action in progress."],
  ["ははは いま りょうりを し＿＿。\n(My mother is cooking now.)",["ています","ていません","ましょう","ました"],0,"Cooking now is ています."],
  ["わたしは とうきょうに すん＿＿。\n(I live in Tokyo.)",["でいます","ています","いています","でます"],0,"すむ becomes すんで, so すんでいます."]]),
 LG('てください for requests',['て-form + ください means "please do".','ちょっと まってください。 Please wait a moment.'],[
  ["ここに なまえを かい＿＿。\n(Please write your name here.)",["てください","でください","ましょう","ませんか"],0,"かく becomes かいて."],
  ["ゆっくり はなし＿＿。\n(Please speak slowly.)",["てください","でください","ました","ません"],0,"はなす becomes はなして."],
  ["この ほんを よん＿＿。\n(Please read this book.)",["でください","てください","いてください","ってください"],0,"よむ becomes よんで."]]),
 LG('Prohibition and permission',['ないでください = please do not','てはいけません = must not','てもいいです = may'],[
  ["ここで たばこを すわ＿＿。\n(Please do not smoke here.)",["ないでください","なくてください","ませんでください","ないください"],0,"ない-form + でください asks someone not to."],
  ["ここに はいって＿＿。\n(You must not enter here.)",["はいけません","もいいです","ください","ましょう"],0,"てはいけません is a prohibition."],
  ["この ペンを つかっても＿＿ですか。\n(May I use this pen?)",["いい","だめ","ない","いけません"],0,"てもいいですか asks permission."]]),
 LG('い-adjectives: negative and past',['Negative: い becomes くないです.','Past: い becomes かったです.','おいしい → おいしくないです → おいしかったです'],[
  ["この りょうりは おいし＿＿。\n(This dish is not delicious.)",["くないです","じゃないです","ないです","ではないです"],0,"Drop い and add くないです."],
  ["きのうは さむ＿＿。\n(It was cold yesterday.)",["かったです","いでした","くなかった","でした"],0,"Drop い and add かったです."],
  ["あの みせは やす＿＿。\n(That shop is cheap.)",["いです","です","だです","くです"],0,"The plain form already ends in い."]]),
 LG('な-adjectives',['な-adjective + noun: しずかな へや','Negative: きれいじゃありません','Likes and skills use が: すしが すきです。'],[
  ["ここは しずか＿＿ へやです。\n(This is a quiet room.)",["な","の","に","で"],0,"な links a な-adjective to a noun."],
  ["わたしは すし＿＿ すきです。\n(I like sushi.)",["が","を","に","は"],0,"すき takes が for the thing liked."],
  ["この まちは きれい＿＿ ありません。\n(This town is not pretty.)",["じゃ","くない","な","に"],0,"じゃありません is the negative of a noun or な-adjective."]]),
 LG('が for but and for ability',['が at the end of a clause means "but".','Skills and understanding take が: えいごが わかります。'],[
  ["にほんごは むずかしいです＿＿、おもしろいです。\n(Japanese is difficult, but interesting.)",["が","を","に","と"],0,"が links two contrasting clauses."],
  ["わたしは りょうり＿＿ じょうずです。\n(I am good at cooking.)",["が","を","に","で"],0,"じょうず takes が."],
  ["ははは えいご＿＿ わかります。\n(My mother understands English.)",["が","を","に","で"],0,"わかります takes が."]]),
 LG('あります and います',['あります = there is (things, plants)','います = there is (people, animals)','Negative: ありません, いません'],[
  ["つくえの うえに ほんが＿＿。\n(There is a book on the desk.)",["あります","います","ありません","いません"],0,"A book is a thing, so あります."],
  ["へやに ねこが＿＿。\n(There is a cat in the room.)",["います","あります","いません","ありません"],0,"A cat is an animal, so います."],
  ["いえに くるまは＿＿。\n(There is no car at home.)",["ありません","いません","ですか","ました"],0,"A car is a thing, and the sentence is negative."]]),
 LG('Comparing: より and いちばん',['A より B のほうが ～ means "B is more ～ than A".','いちばん = the most','どちらが = which of the two'],[
  ["ねこ＿＿ いぬの ほうが すきです。\n(I like dogs more than cats.)",["より","から","まで","も"],0,"より marks what you compare against."],
  ["りんごと みかんと、どちら＿＿ すきですか。\n(Which do you like more, apples or mandarins?)",["が","を","に","で"],0,"どちらが asks which of two."],
  ["くだもので なにが＿＿ すきですか。\n(Which fruit do you like the most?)",["いちばん","とても","もう","まだ"],0,"いちばん means the most."]]),
 LG('から for reasons',['Reason + から means "because" or "so".','あめですから、うちに います。'],[
  ["あめです＿＿、うちに います。\n(It is raining, so I stay home.)",["から","まで","より","と"],0,"から follows the reason."],
  ["さむいです＿＿、コートを きます。\n(It is cold, so I wear a coat.)",["から","まで","を","に"],0,"から links the reason to the result."],
  ["いそがしかった＿＿、ともだちに あいませんでした。\n(I was busy, so I did not meet my friend.)",["から","より","で","と"],0,"から gives the reason."]]),
 LG('に いきます for purpose',['Verb stem or noun + に いきます means "go in order to".','かいものに いきます。 I go shopping.'],[
  ["デパートへ かいもの＿＿ いきます。\n(I go to the department store to shop.)",["に","を","で","と"],0,"に marks the purpose."],
  ["ともだちと えいがを み＿＿ いきます。\n(I go to see a movie with a friend.)",["に","で","を","と"],0,"Stem + に いきます."],
  ["としょかんへ ほんを かり＿＿ いきます。\n(I go to the library to borrow a book.)",["に","で","を","と"],0,"Stem + に shows purpose."]]),
 LG('もう and まだ',['もう + past = already','まだ + negative = not yet','ぜんぜん + negative = not at all'],[
  ["しゅくだいは ＿＿ おわりました。\n(I have already finished my homework.)",["もう","まだ","ぜんぜん","いつも"],0,"もう means already."],
  ["ごはんを たべましたか。 いいえ、＿＿ たべていません。\n(Have you eaten? No, not yet.)",["まだ","もう","とても","いつも"],0,"まだ with the negative means not yet."],
  ["わたしは さかなを ＿＿ たべません。\n(I never eat fish.)",["ぜんぜん","とても","もう","よく"],0,"ぜんぜん goes with a negative."]])]},
{title:'N5 Reading',sub:'Short passages like the exam',lessons:[
 LR('My neighborhood',"わたしの うちは えきから ちかいです。うちの ちかくに こうえんが あります。まいあさ、こうえんで いぬと あるきます。","My house is close to the station. There is a park near my house. Every morning I walk with my dog in the park.",[["Where does the writer walk every morning?",["In the park","At the station","At school","At the library"],0],["Where is the writer's house?",["Close to the station","Far from the station","Next to a school","Near a hospital"],0]]),

 LR('A notice',"たなかさんへ。あしたの かいぎは 10じからです。1じかんで おわります。へやは 2かいの 3ばんです。やまだ","To Mr. Tanaka: Tomorrow's meeting starts at 10. It will end in one hour. The room is number 3 on the second floor. Yamada",[["What time does the meeting end?",["11:00","10:00","1:00","3:00"],0],["Where is the meeting room?",["Second floor","First floor","Third floor","Room 10"],0]]),
 LR('Shopping',"わたしは きのう デパートへ いきました。あたらしい くつを かいました。5,000えんでした。すこし たかかったですが、とても きれいです。","Yesterday I went to a department store. I bought new shoes. They cost 5,000 yen. They were a little expensive, but they are very pretty.",[["What did the writer buy?",["Shoes","A bag","A hat","Clothes"],0],["How was the price?",["A little expensive","Very cheap","Free","Too cheap"],0]])]}

{title:'N3 Reading',sub:'Notices, essays and emails like those in the exam',lessons:[

 LR('Reading habits',"最近、本を 読まない 人が 増えて いると 言われます。スマートフォンで 情報が すぐに 手に 入る ので、わざわざ 本を 買う 必要が ないと 考える 人が 多いのでしょう。しかし、私は 本を 読む ことには 特別な 良さが あると 思います。一冊の 本を 最後まで 読むと、自分で 考える 力が 身に つく からです。","It is said that more people do not read books these days. Because information is quickly available on smartphones, many people probably think there is no need to buy books. However, I think reading books has a special value. If you read a whole book to the end, you gain the ability to think for yourself.",[["Why do many people not read books?",["They can get information quickly on smartphones","Books are too expensive","They have no time to go to shops","Books are hard to find"],0],["What does the writer value in reading?",["It builds the ability to think for yourself","It is cheaper than the internet","It is faster","It helps you sleep"],0],["What is the writer's opinion?",["Books have a special value","Books are outdated","Smartphones are bad","Nobody should read"],0]]),
 LR('Rescheduling an appointment',"山口様。お世話に なって おります。来週の 打ち合わせの 件ですが、水曜日の 午後は 別の 予定が 入って しまいました。申し訳ありませんが、木曜日の 午前中に 変更して いただけないでしょうか。もし 難しければ、金曜日でも かまいません。ご返事を お待ちして おります。鈴木","Dear Mr. Yamaguchi. Thank you for your continued support. About next week's meeting: another appointment has come up on Wednesday afternoon. I am sorry, but could we change it to Thursday morning? If that is difficult, Friday is also fine. I look forward to your reply. Suzuki",[["What does Suzuki want?",["To move the meeting to Thursday morning","To cancel the meeting","To meet on Wednesday afternoon","To meet by phone"],0],["Why is Wednesday afternoon difficult?",["Another appointment came up","Suzuki is sick","The office is closed","It is a holiday"],0],["What if Thursday is difficult?",["Friday is acceptable","The meeting is cancelled","Next month","Wednesday morning"],0]]),
 LR('A trip abroad',"私は 去年、はじめて 一人で 海外旅行に 行きました。言葉が 通じなくて 困る ことも ありましたが、親切な 人たちに 助けて もらいました。この 経験で、知らない 人と 話す ことが こわくなくなりました。今は、次の 旅行の 計画を 立てて います。","Last year I went on an overseas trip alone for the first time. There were times I was in trouble because I could not make myself understood, but kind people helped me. Through this experience I stopped being afraid of talking to strangers. Now I am planning my next trip.",[["What troubled the writer?",["Not being understood","Losing a passport","Bad food","Bad weather"],0],["What changed for the writer?",["No longer afraid to talk to strangers","Learned to cook","Made a lot of money","Stopped travelling"],0],["What is the writer doing now?",["Planning the next trip","Studying abroad","Working overseas","Writing a book"],0]])]},

  [[['A','引っ越しするなら、駅に 近い ほうが いいと 思う。'],['B','でも 家賃が 高いよ。'],['A','確かに。じゃ、少し 遠くても 安い ほうに しようか。']],'What do they decide?',['A cheaper place farther away','A place near the station','To stay where they are','To buy a house'],0,'They choose the cheaper, farther place.'],
  [[['A','この 映画、おもしろかった?'],['B','最初は つまらなかったけど、最後は 感動したよ。']],'How was the movie?',['Boring at first, moving at the end','Fun all the way through','Boring all the way through','Scary'],0,'It was boring at first but moving at the end.']])]}

{title:'N2 Grammar',sub:'Choose the best word to fill the blank',lessons:[
 LG('Relation and topic','に関して: concerning. をめぐって: over, around. に基づいて: based on. をはじめ: starting with.',[
  ["この 問題＿＿＿、皆さんの 意見を 聞かせて ください。\n(Please tell me your opinions on this issue.)",["に関して","に基づいて","をはじめ","にわたって"],0,"に関して means concerning."],
  ["新しい 法律＿＿＿、国会で 激しい 議論が 行われた。\n(There was heated debate in the Diet over the new law.)",["をめぐって","にわたって","に応じて","に限って"],0,"をめぐって means over or surrounding an issue."],
  ["この 映画は 実際に あった 事件＿＿＿ 作られた。\n(This film was made based on a real incident.)",["に基づいて","をはじめ","をめぐって","にとって"],0,"に基づいて means based on."],
  ["東京＿＿＿、日本の 大都市では 人口が 減って いる。\n(Starting with Tokyo, the populations of Japan's big cities are shrinking.)",["をはじめ","に限って","ついでに","を通じて"],0,"をはじめ lists examples starting with the most representative."]]),
 LG('Scope and correspondence','にわたって: across a span. において: at, in. を通じて: through. に応じて: in accordance with.',[
  ["会議は 三日間＿＿＿ 行われた。\n(The conference was held over three days.)",["にわたって","において","に応じて","をはじめ"],0,"にわたって covers a period or range."],
  ["去年の 大会は 京都＿＿＿ 開かれた。\n(Last year's tournament was held in Kyoto.)",["において","にわたって","をめぐって","に基づいて"],0,"において is a formal way to say at a place or occasion."],
  ["収入＿＿＿ 税金の 額が 変わります。\n(The amount of tax changes according to income.)",["に応じて","にわたって","に限って","ついでに"],0,"に応じて means in accordance with."],
  ["インターネットを＿＿＿、世界中の 人と 交流できる。\n(Through the internet we can interact with people all over the world.)",["通じて","はじめ","基づいて","わたって"],0,"を通じて means through a medium."]]),
 LG('Cannot and must','かねる: cannot bring oneself to. ようがない: no way to. わけにはいかない: cannot afford to. ざるを得ない: have no choice but.',[
  ["申し訳ありませんが、その ご要望は お受け＿＿＿。\n(I am sorry, but I cannot accept that request.)",["しかねます","しかねません","しがちです","しっぱなしです"],0,"V stem + かねる is a polite way to refuse."],
  ["連絡先が わからないので、連絡の＿＿＿ ありません。\n(I do not know the contact details, so there is no way to get in touch.)",["しようが","しがちが","しっぱなしが","しぎみが"],0,"V stem + ようがない means there is no way to."],
  ["明日は 大事な 試験が ある ので、今夜は 遊ぶ＿＿＿ いかない。\n(I have an important exam tomorrow, so I cannot play tonight.)",["わけには","ことが","ものか","だけに"],0,"V + わけにはいかない means cannot do for moral or practical reasons."],
  ["台風で 電車が 止まって いるので、会社を 休まざる＿＿＿。\n(Trains are stopped by the typhoon, so I have no choice but to skip work.)",["を得ない","に違いない","ものではない","ことはない"],0,"V ない stem + ざるを得ない means have no choice but to."]]),
 LG('Tendencies','がち: tends to. 気味: slightly. っぽい: -ish. だらけ: full of.',[
  ["冬は 風邪を ひき＿＿＿ です。\n(In winter I tend to catch colds.)",["がち","ぎみ","っぽい","だらけ"],0,"V stem + がち means tends to."],
  ["風邪＿＿＿ なので、今日は 早く 帰ります。\n(I have a slight cold, so I will go home early today.)",["気味","がち","っぽい","だらけ"],0,"Noun + 気味 means a slight sign of."],
  ["彼は 子ども＿＿＿ ところが ある。\n(He has a childish side.)",["っぽい","がち","ぎみ","だらけ"],0,"Noun + っぽい means having the quality of."],
  ["部屋が ごみ＿＿＿ です。\n(The room is full of trash.)",["だらけ","ぎみ","がち","っぽい"],0,"Noun + だらけ means covered in, full of."]]),
 LG('Contrast','ものの: although. にしては: considering. わりに: in contrast to. 中: in the midst of.',[
  ["日本語を 習い始めて 三か月＿＿＿、とても 上手だ。\n(Considering he only started three months ago, his Japanese is very good.)",["にしては","ばかりに","くせに","あまり"],0,"にしては means considering that."],
  ["約束した＿＿＿、実は まだ 準備が できて いない。\n(Although I promised, I have not actually prepared yet.)",["ものの","ばかり","くらい","ほど"],0,"〜ものの means although."],
  ["この 店は 値段が 高い＿＿＿、あまり おいしくない。\n(For the high prices, the food here is not very good.)",["わりに","ように","ために","とおり"],0,"わりに shows a gap between expectation and reality."],
  ["お忙しい＿＿＿、手伝って くださって ありがとう ございます。\n(Thank you for helping even though you are busy.)",["中","うち","まま","ばかり"],0,"〜中 (ちゅう) means in the midst of, often used politely."]]),
 LG('Feeling and certainty','ずにはいられない: cannot help. てならない: extremely. に違いない: surely. かねない: may well.',[
  ["この 話を 聞いて、泣か＿＿＿ いられなかった。\n(Hearing this story, I could not help crying.)",["ずには","ないで","なくて","ないが"],0,"V ない stem + ずにはいられない means cannot help doing."],
  ["昔の ことが 思い出されて＿＿＿。\n(I cannot stop remembering the old days.)",["ならない","かまわない","ちがいない","かねない"],0,"て + ならない shows an emotion you cannot suppress."],
  ["あの 人が 犯人に＿＿＿。\n(That person must be the culprit.)",["違いない","ならない","限らない","かねない"],0,"に違いない shows strong conviction."],
  ["あの 人は うそを つき＿＿＿ 人だ。\n(That person is the kind who might well lie.)",["かねない","がたい","ようがない","にくい"],0,"V stem + かねない means there is a risk of, may well."]]),
 LG('Sequence and grounds','てはじめて: only after. うえで: after. 次第: as soon as. 以上: since.',[
  ["病気に なって＿＿＿、健康の 大切さが わかった。\n(Only after I fell ill did I understand the value of health.)",["はじめて","からして","いらい","ずに"],0,"Vて + はじめて means only after doing."],
  ["内容を よく 確認した＿＿＿ 契約して ください。\n(Please sign after you have checked the contents carefully.)",["うえで","うちに","ばかりに","くせに"],0,"Vた + うえで means after doing."],
  ["日程が 決まり＿＿＿、お知らせします。\n(I will inform you as soon as the schedule is decided.)",["次第","ながら","がち","ぎみ"],0,"V stem + 次第 means as soon as."],
  ["学生である＿＿＿、勉強を 第一に 考えるべきだ。\n(Since you are a student, you should put studying first.)",["以上","ばかり","ところ","くらい"],0,"〜以上 means given that."]]),
 LG('Discourse connectors','しかも: moreover. 要するに: in short. ただし: however, provided that. すなわち: that is.',[
  ["彼は 英語も 中国語も 話せる。＿＿＿、日本語も ぺらぺらだ。\n(He speaks English and Chinese. Moreover, he is fluent in Japanese.)",["しかも","ところが","ただし","すなわち"],0,"しかも adds an extra point."],
  ["長い 説明だったが、＿＿＿ 来月から 料金が 上がると いう ことだ。\n(It was a long explanation, but in short, prices rise from next month.)",["要するに","ところが","もっとも","さて"],0,"要するに summarizes."],
  ["入場は 無料です。＿＿＿、予約が 必要です。\n(Admission is free. However, a reservation is required.)",["ただし","したがって","つまり","あるいは"],0,"ただし adds a condition."],
  ["彼は 東京の 出身、＿＿＿ 関東の 出身だ。\n(He is from Tokyo, that is, from the Kanto region.)",["すなわち","ところが","ただし","かえって"],0,"すなわち restates in other words."]])]},
{title:'N2 Reading',sub:'Commentary, notices and letters',lessons:[
 LR('Working from home',"近年、在宅勤務を 導入する 企業が 増えて いる。通勤時間が なくなり、家族と 過ごす 時間が 増えた という 声が ある 一方で、仕事と 私生活の 区別が つきにくく なったと 感じる 人も 少なくない。結局のところ、働き方に 絶対の 正解は なく、各自の 事情に 応じて 選べる 制度が 望ましいと 言えるだろう。","In recent years the number of companies introducing remote work has grown. While some say they no longer commute and spend more time with family, not a few people feel it has become hard to separate work from private life. In the end there is no single correct way of working, and a system that lets each person choose according to their circumstances is desirable.",[["What benefit of remote work is mentioned?",["No commute, more time with family","Higher pay","Shorter meetings","Better equipment"],0],["What worry is mentioned?",["It is hard to separate work and private life","Costs go up","Bosses cannot see work","Fewer holidays"],0],["What does the writer conclude?",["A system where people can choose by circumstance is desirable","Everyone should work from home","Remote work should end","Offices should be bigger"],0]]),
 LR('Garbage rules',"市民の みなさまへ。ごみの 出し方が 来月一日から 一部 変わります。これまで 燃えない ごみは 月に 一回の 回収でしたが、今後は 月に 二回に なります。ただし、大型ごみは 事前の 申し込みが 必要です。くわしくは 市の ホームページを ご覧ください。","To citizens: Some garbage rules change from the first of next month. Until now, non-burnable garbage was collected once a month, but from now on it will be twice a month. However, large items require an advance application. Please see the city website for details.",[["What is changing?",["Non-burnable garbage will be collected twice a month","Burnable garbage will stop","Collection moves to evenings","Fees are introduced"],0],["What is required for large items?",["An advance application","A payment on the day","A neighbor's signature","Nothing"],0],["Where can citizens find details?",["On the city website","At the post office","In the newspaper","By phone only"],0]]),
 LR('Words change',"言葉は 時代と ともに 変化する。「やばい」の ような 言葉は、もともとは 悪い 意味だけで 使われて いたが、今では 良い 意味でも 使われる。これを 乱れと 呼ぶ 人も いるが、言葉が 生きて いる 証拠だ という 見方も ある。大切なのは、場面に 応じて 適切な 言葉を 選ぶ ことでは ないだろうか。","Language changes with the times. A word like やばい was originally used only in a bad sense but is now also used in a good sense. Some call this disorder, but another view is that it proves that language is alive. What matters is perhaps choosing appropriate words according to the situation.",[["What example of language change is given?",["やばい is now used positively too","A new kanji was created","A word disappeared","Grammar was simplified"],0],["What is one view of such change?",["It is evidence that language is alive","It is always wrong","It is caused by schools","It only affects young people"],0],["What does the writer say is important?",["Choosing words suitable for the situation","Using only old words","Avoiding slang entirely","Teaching children grammar"],0]]),
 LR('A letter of apology',"拝啓 先日は、ご多忙の ところ 弊社の 製品に ついて お問い合わせ いただき、誠に ありがとうございました。調査の 結果、ご注文の 品が 誤って 別の 住所に 発送されて いた ことが 判明いたしました。深く お詫び申し上げます。本日、正しい 商品を 改めて お送りいたしました。今後は このような ことが ないよう、確認体制を 見直して まいります。敬具","Dear Sir or Madam: Thank you for contacting us about our product the other day despite your busy schedule. Our investigation found that the item you ordered had been sent to a different address by mistake. We sincerely apologize. Today we have sent the correct item again. To prevent this from happening in future, we will review our checking system.",[["What was the problem?",["The item was shipped to the wrong address","The item was broken","The price was wrong","The item was out of stock"],0],["What did the company do?",["Sent the correct item again","Issued a refund only","Asked the customer to come","Cancelled the order"],0],["What will the company do in future?",["Review its checking system","Raise prices","Stop shipping","Hire a lawyer"],0]])]},

{title:'N1 Reading',sub:'Essays and commentary like those in the exam',lessons:[
 LR('Technology and work',"技術の 進歩は 私たちの 生活を 便利に した 反面、新たな 問題も 生み出して いる。例えば、人工知能の 普及に よって、単純な 作業が 機械に 置き換えられ、失業を 懸念する 声が 高まって いる。しかし 歴史を 振り返れば、新しい 技術は 常に 新しい 仕事を 創り出して きた。重要なのは、変化を 恐れる ことなく、必要な 能力を 身に つける 努力を 続ける ことで あろう。","While technological progress has made life more convenient, it has also produced new problems. For example, with the spread of AI, simple tasks are being replaced by machines and concern about unemployment is growing. But looking back at history, new technology has always created new jobs. What matters is to keep making efforts to acquire necessary skills without fearing change.",[["What concern is raised?",["Simple tasks being replaced by AI could cause unemployment","Machines are too expensive","AI is unreliable","Workers have too much leisure"],0],["What does history show, according to the writer?",["New technology has created new jobs","Technology always fails","Jobs never change","Machines were rejected"],0],["What is the writer's main point?",["Do not fear change, keep acquiring needed skills","Ban AI","Return to old methods","Wait for the government"],0]]),
 LR('Traditional crafts',"伝統工芸の 世界では、後継者の 不足が 深刻化して いる。技術の 習得には 長い 年月を 要する うえ、収入が 安定しない ことから、若者が 敬遠しがちな のが 現状だ。だが 近年、海外での 評価の 高まりを 背景に、あえて この 道を 選ぶ 若者も 現れ始めた。伝統を 守る ことは、単に 過去を 保存する ことでは なく、新しい 価値を 生み出し続ける ことなので ある。","In the world of traditional crafts the shortage of successors is becoming serious. Mastering the skills takes many years and income is unstable, so young people tend to avoid it. In recent years, however, against a background of rising reputation abroad, some young people have begun to choose this path deliberately. Preserving tradition is not merely preserving the past but continuing to create new value.",[["Why do young people tend to avoid crafts?",["Long training and unstable income","Low social status","Strict families","Foreign competition"],0],["What recent change is mentioned?",["Some young people choose crafts due to growing overseas recognition","Government subsidies doubled","Schools closed","Prices fell"],0],["How does the writer view preserving tradition?",["As continually creating new value","As keeping the past unchanged","As unnecessary","As a hobby"],0]]),
 LR('Children in the park',"先日の 記事に あった、公園での 子どもの 声を 騒音と 見なす 動きに ついて 考えさせられた。確かに 静けさを 求める 住民の 気持ちも 理解できる。しかし、子どもの 声を 排除する 社会が、果たして 健全と 言えるだろうか。互いの 事情に 配慮し、折り合いを つける 努力こそが 求められて いると 思う。","The article the other day about a movement to treat children's voices in parks as noise made me think. I can certainly understand the feelings of residents who want quiet. But can a society that excludes children's voices really be called healthy? I think what is needed is the effort to consider each other's circumstances and reach a compromise.",[["What issue does the writer discuss?",["Treating children's voices in parks as noise","Building new parks","School hours","Traffic safety"],0],["Whom does the writer say they can understand?",["Residents who want quiet","Park managers","Politicians","Reporters"],0],["What is the writer's conclusion?",["Mutual consideration and compromise are needed","Parks should close","Residents should move","Children must be silent"],0]]),
 LR('Sleep and memory',"睡眠が 記憶の 定着に 重要な 役割を 果たす ことは、多くの 研究で 示されて いる。ある 実験では、学習の 後に 十分な 睡眠を とった 群の ほうが、徹夜を した 群より 成績が 高かった。この 結果から、試験前の 徹夜は かえって 逆効果に なりかねないと 言える。もっとも、睡眠時間の 最適な 長さには 個人差が あり、一概には 断定できない。","Many studies show that sleep plays an important role in fixing memories. In one experiment the group that slept enough after studying scored higher than the group that stayed up all night. From this result it can be said that staying up all night before an exam may well backfire. However, the optimal length of sleep differs between individuals and cannot be stated categorically.",[["What did the experiment find?",["The group that slept scored higher","The all-night group scored higher","No difference","Scores depended on age"],0],["What does the writer imply about all-nighters?",["They may backfire","They are necessary","They improve memory","They are harmless"],0],["What caveat does the writer give?",["Optimal sleep length differs between individuals","Sleep has no effect","The sample was too large","Exams are unreliable"],0]])]},

  [[['A','景気が 緩やかに 回復して いると 言われますが、実感は ありますか。'],['B','正直、あまり ありません。物価の 上昇に 賃金が 追いついて いないので。']],'Why does B not feel the recovery?',['Wages lag behind prices','Taxes rose','Unemployment rose','The yen weakened'],0,'Wages have not caught up with prices.'],
  [[['A','この 伝統行事は 若い 世代の 参加が 減って いるそうですね。'],['B','ええ、担い手の 確保が 急務です。そこで、学生ボランティアを 募る ことに しました。']],'What measure did they take?',['Recruit student volunteers','Cancel the event','Raise fees','Move the event'],0,'They decided to recruit student volunteers.']]),
 LD('Formal conversations',[

  [[['A','先日の 件、ご配慮 いただき 恐縮です。'],['B','いえいえ、お役に 立てて 何よりです。今後とも よろしく お願いします。']],'What is A doing?',['Expressing thanks','Complaining','Refusing','Asking for money'],0,'恐縮です expresses gratitude and a sense of obligation.'],
  [[['A','会議の 日程ですが、参加者の 都合を 考慮すると、来週の 木曜日が 無難かと。'],['B','ひとまず 木曜日で 仮押さえして おこう。']],'What will B do?',['Tentatively book Thursday','Fix Friday','Cancel the meeting','Ask everyone again'],0,'B will tentatively reserve Thursday.']])]}
];
N1[0].lessons.push(LW('Analysis words',`是非|ぜひ|right and wrong;余地|よち|room, scope;動機|どうき|motive;兆し|きざし|sign, omen;実態|じったい|actual state;趨勢|すうせい|trend;弊害|へいがい|ill effect;示唆|しさ|suggestion`));
/* ---------- level registry: every JLPT level N5..N1 is described the same way ---------- */
const LVK=['n5','n4','n3','n2','n1'];
const LV={};
function regLv(k,units){const F=[],G=[],R=[],D=[];
 units.forEach((u,ui)=>u.lessons.forEach((L,li)=>{F.push({ui,li,id:k+'u'+ui+'l'+li});(L.gram||[]).forEach(q=>G.push(q));if(L.read)L.read.qs.forEach(q=>R.push([L.read,q]));if(L.listen)L.listen.forEach(d=>D.push(d))}));
 LV[k]={k,n:k.toUpperCase(),lv:+k[1],units,F,G,R,D}}
regLv('n5',N5);regLv('n4',N4);regLv('n3',N3);regLv('n2',N2);regLv('n1',N1);
const lid=(ui,li)=>'u'+ui+'l'+li;
const ALL={};let ALLL=[];
function indexAll(){Object.keys(ALL).forEach(k=>delete ALL[k]);UNITS.forEach(u=>u.lessons.forEach(L=>(L.items||[]).forEach(i=>ALL[i.id]=i)));LVK.forEach(k=>LV[k].units.forEach(u=>u.lessons.forEach(L=>(L.items||[]).forEach(i=>ALL[i.id]=i))));Object.values(S.custom).forEach(i=>ALL[i.id]=i);ALLL=Object.values(ALL)}
indexAll();
const EXTRA=['が','も','の','へ','で','と'];
const ALLSENT=[];UNITS.forEach(u=>u.lessons.forEach(L=>(L.sentences||[]).forEach(s=>ALLSENT.push(s))));
const lvDone=k=>LV[k].F.filter(f=>S.done[f.id]).length;
const tgtLv=()=>LVK.includes(S.profile.lv)?S.profile.lv:'n5';
/* ---------- exercise generators ---------- */
const ans=it=>it.type==='kana'?it.rom:it.en;
const norm=s=>String(s).toLowerCase().replace(/[\s'’\-]/g,'').replace(/ou|oo/g,'o').replace(/uu/g,'u').replace(/si/g,'shi').replace(/ti/g,'chi').replace(/tu/g,'tsu').replace(/hu/g,'fu').replace(/zi/g,'ji');
const poolFor=it=>{const a=ALLL.filter(x=>x.type===it.type&&(it.type!=='kana'||x.script===it.script)&&!!x.lvl===!!it.lvl);if(!it.lvl)return a;const b=a.filter(x=>x.lvl===it.lvl);return b.length>=12?b:a};
const sp=it=>it.kana||it.jp;
const fsz=p=>Math.min(88,Math.max(34,Math.floor(300/Math.max(1,String(p).length))));
function others(it,key,n){const seen=new Set([key(it)]),out=[];for(const p of shuffle(poolFor(it))){const k=key(p);if(!seen.has(k)){seen.add(k);out.push(p);if(out.length===n)break}}return out}
const canListen=()=>!!jaVoice;
const info=it=>it.type==='kana'?it.jp+'  ·  '+it.rom:it.lvl?it.jp+(it.kana&&it.kana!==it.jp?' ('+it.kana+')':'')+'  ·  '+it.en+(it.more?'  ·  '+it.more:''):it.jp+'  ·  '+it.rom+'  ·  '+it.en;
function mcJ2E(it){const o=others(it,ans,3);return{kind:'mc',label:it.type==='kana'?'Select the sound':it.type==='kanji'?'What does this kanji mean?':'What does this mean?',prompt:it.jp,pj:true,speak:it.type==='kanji'?null:sp(it),opts:shuffle([it,...o]).map(ans),answer:ans(it),ids:[it.id],info:info(it)}}
function mcE2J(it){const o=others(it,x=>x.jp,3);return{kind:'mc',label:it.type==='kana'?'Select the character':'Select the Japanese',prompt:ans(it),pj:false,speak:null,opts:shuffle([it,...o]).map(x=>x.jp),ojp:true,answer:it.jp,ids:[it.id],info:info(it)}}
function lisEx(it){if(it.type==='kanji'||!canListen())return mcE2J(it);const e=mcE2J(it);e.listen=true;e.speak=sp(it);e.label='Tap what you hear';return e}
function typeEx(it){if(it.type==='kanji')return mcJ2E(it);return{kind:'type',label:'Type it in romaji',prompt:it.jp,speak:sp(it),answers:it.rom.split('/').map(x=>x.trim()),ids:[it.id],info:info(it)}}
function matchEx(items){const its=pick(items,5);return{kind:'match',label:'Tap the matching pairs',ids:its.map(i=>i.id),L:shuffle(its.map(i=>({id:i.id,t:i.jp}))),R:shuffle(its.map(i=>({id:i.id,t:ans(i)}))),done:[],selL:null,miss:0,flash:null}}
function buildEx(s){const bank=shuffle([...s.tokens,...pick(EXTRA.filter(t=>!s.tokens.includes(t)),2)]).map(t=>({t}));return{kind:'build',label:'Translate this sentence',en:s.en,tokens:s.tokens,bank,picked:[],ids:[],info:s.en,speak:s.tokens.join('')}}
function mcSent(s){const o=pick(ALLSENT.filter(x=>x.en!==s.en),3).map(x=>x.en);return{kind:'mc',label:'What does this say?',prompt:s.tokens.join(''),pj:true,mid:true,speak:s.tokens.join(''),opts:shuffle([s.en,...o]),answer:s.en,ids:[],info:s.en}}
const gen=(it,k)=>k==='j2e'?mcJ2E(it):k==='e2j'?mcE2J(it):k==='listen'?lisEx(it):typeEx(it);
function readEx(it){const pool=ALLL.filter(x=>x.lvl===it.lvl&&x.type==='vocab'&&x.kana&&x.kana!==x.jp&&x.kana!==it.kana);const o=pick(pool,3).map(x=>x.kana);return{kind:'mc',label:'How is this read?',prompt:it.jp,pj:true,speak:null,opts:shuffle([it.kana,...o]),answer:it.kana,ojp:true,ids:[it.id],info:info(it)}}
function orthEx(it){const pool=ALLL.filter(x=>x.lvl===it.lvl&&x.type==='vocab'&&x.kana&&x.kana!==x.jp&&x.jp!==it.jp);const o=pick(pool,3).map(x=>x.jp);return{kind:'mc',label:'Choose the correct writing',prompt:it.kana,pj:true,speak:null,opts:shuffle([it.jp,...o]),answer:it.jp,ojp:true,ids:[it.id],info:info(it)}}
const gramEx=q=>({kind:'mc',label:'Choose the correct word',prompt:q.s,pj:true,small:true,speak:null,opts:shuffle(q.o),answer:q.o[q.a],ojp:true,ids:[],info:q.w});
const readQEx=(r,q)=>({kind:'mc',label:'Read and answer',passage:r.jp,prompt:q[0],pj:false,speak:null,opts:shuffle(q[1]),answer:q[1][q[2]],ids:[],info:'Translation: '+r.en});
const dlgEx=d=>({kind:'mc',label:'Listen and answer',dlg:d.lines,prompt:d.q,pj:false,speak:null,opts:shuffle(d.o.slice()),answer:d.o[d.a],ids:[],info:d.lines.map(l=>l[1]).join(' ')+'  |  '+d.en});
function planN5(L){
 if(L.listen)return shuffle(L.listen.map(dlgEx));
 if(L.gram)return L.gram.map(gramEx);
 if(L.read)return L.read.qs.map(q=>readQEx(L.read,q));
 const it=L.items,ex=[];
 it.forEach((x,i)=>{
  if(x.type==='kanji'){ex.push(i%2?mcE2J(x):mcJ2E(x));return}
  const h=x.kana&&x.kana!==x.jp,k=i%3;
  ex.push(k===0?mcJ2E(x):k===1?(h?readEx(x):mcE2J(x)):lisEx(x))});
 const out=shuffle(ex);
 if(it.length>=5)out.push(matchEx(it));
 shuffle(it).slice(0,2).forEach(x=>out.push(typeEx(x)));
 return out}
const MOCKM={n5:[60,40],n4:[70,45],n3:[80,50],n2:[90,55],n1:[100,60]};
const curLv=()=>LV[JL.lv]?JL.lv:tgtLv();
function mockCounts(k,full){const c=full?{r:10,o:8,m:9,k:3,g:22,b:8,p:14,w:6,d:6}:{r:7,o:5,m:5,k:3,g:15,b:5,p:8,w:4,d:4};if(k!=='n5'){c.g+=c.b;c.b=0}return c}
function buildMock(k,full){
 const lv=LV[k].lv,V=ALLL.filter(x=>x.lvl===lv&&x.type==='vocab'),KJ=ALLL.filter(x=>x.lvl===lv&&x.type==='kanji'),wk=V.filter(x=>x.kana&&x.kana!==x.jp),q=[];
 const C=mockCounts(k,full),tag=(e,s)=>{e.sec=s;if(!e.listen)e.speak=null;return e};
 pick(wk,C.r).forEach(x=>q.push(tag(readEx(x),'Vocabulary')));
 pick(wk,C.o).forEach(x=>q.push(tag(orthEx(x),'Vocabulary')));
 pick(V,C.m).forEach(x=>q.push(tag(mcJ2E(x),'Vocabulary')));
 pick(KJ,C.k).forEach(x=>q.push(tag(mcJ2E(x),'Vocabulary')));
 pick(LV[k].G,C.g).forEach(x=>q.push(tag(gramEx(x),'Grammar')));
 if(C.b)pick(ALLSENT,C.b).forEach(x=>q.push(tag(buildEx(x),'Grammar')));
 pick(LV[k].R,C.p).forEach(x=>q.push(tag(readQEx(x[0],x[1]),'Reading')));
 if(canListen()){pick(LV[k].D,C.d).forEach(d=>q.push(tag(dlgEx(d),'Listening')));pick(V,C.w).forEach(x=>q.push(tag(lisEx(x),'Listening')))}
 return q}
function planLesson(L){
 if(L.sentences){return[...pick(L.sentences,2).map(mcSent),...shuffle(L.sentences).map(buildEx)]}
 const it=L.items,ex=[];
 const a=[];it.forEach((x,i)=>{a.push(mcJ2E(x));a.push(i%2?lisEx(x):mcE2J(x))});ex.push(...shuffle(a));
 if(it.length>=3)ex.push(matchEx(it));
 shuffle(it).slice(0,3).forEach(x=>ex.push(typeEx(x)));
 return ex}
function planTest(ui){const u=UNITS[ui],sents=[];u.lessons.forEach(L=>(L.sentences||[]).forEach(s=>sents.push(s)));
 if(sents.length)return pick(sents,6).map(buildEx);
 const items=[];u.lessons.forEach(L=>items.push(...(L.items||[])));
 return pick(items,Math.min(12,items.length)).map(x=>gen(x,one(['j2e','e2j','listen','type'])))}

/* ---------- session ---------- */
let SES=null;
const cur=()=>SES&&SES.q[SES.i];
function start(o){SES=Object.assign({ii:0,i:0,done:0,total:o.q.length,hits:0,miss:0,first:0,t0:Date.now(),quit:false},o);SES.phase=SES.intro&&SES.intro.length?'intro':'q';if(SES.mode==='mock')SES.tid=setInterval(tick,1000);renderSession()}
function startLv(k,ui,li){
 const L=LV[k].units[ui].lessons[li],id=k+'u'+ui+'l'+li,intro=[];
 if(!S.done[id]){if(L.tip)intro.push({tip:L.tip,title:L.title});(L.items||[]).forEach(it=>intro.push({it}))}
 start({mode:'lesson',title:L.title,lid:id,q:planN5(L),intro})}
function startMockL(k,full){const q=buildMock(k,full);if(!q.length){toast('Not enough questions yet');return}start({mode:'mock',title:LV[k].n+(full?' full mock exam':' quick mock exam'),q,lk:k,deadline:Date.now()+MOCKM[k][full?0:1]*60000,sec:{},wrong:[]})}
function updateTm(){const e=$('#tm');if(!e||!SES||!SES.deadline)return;const l=Math.max(0,SES.deadline-Date.now());e.textContent=Math.floor(l/6e4)+':'+String(Math.floor(l%6e4/1e3)).padStart(2,'0')}
function tick(){if(!SES||SES.phase!=='q')return;updateTm();if(Date.now()>=SES.deadline){for(let j=SES.i;j<SES.q.length;j++){const s=SES.q[j].sec||'Other';(SES.sec[s]=SES.sec[s]||{c:0,t:0}).t++;SES.miss++}SES.i=SES.q.length;finish();renderSession()}}
function startLesson(ui,li){
 const L=UNITS[ui].lessons[li],id=lid(ui,li),intro=[];
 if(!S.done[id]){if(L.tip)intro.push({tip:L.tip,title:L.title});(L.items||[]).forEach(it=>intro.push({it}))}
 start({mode:'lesson',title:L.title,lid:id,ui,q:planLesson(L),intro})}
function startTest(ui){start({mode:'test',title:UNITS[ui].title,ui,q:planTest(ui)})}
function startPractice(){
 const ids=Object.keys(S.srs).filter(i=>ALL[i]);
 if(!ids.length){toast('Finish a lesson first. Review unlocks after you learn something.');return}
 const t=today(),due=ids.filter(i=>S.srs[i].d<=t).sort((a,b)=>S.srs[a].d-S.srs[b].d);
 const rest=ids.filter(i=>!due.includes(i)).sort((a,b)=>S.srs[a].b-S.srs[b].b);
 const sel=[...due,...rest].slice(0,10).map(i=>ALL[i]);
 start({mode:'practice',title:'Review',q:sel.map(x=>gen(x,one(['j2e','e2j','listen','type'])))})}

function renderSession(){
 const el=$('#ses');
 if(!SES){el.classList.remove('on');el.innerHTML='';return}
 el.classList.add('on');
 if(SES.phase==='done'){el.classList.remove('qin');el.innerHTML=doneHTML();confetti();return}
 if(SES.phase==='intro'){el.innerHTML=introHTML();el.classList.add('qin');return}
 const ex=cur();el.innerHTML=exHTML(ex);updateTm();const qk=SES.i+':'+SES.ii+':'+SES.phase+':'+(SES.q?SES.q.length:0);if(SES._qk!==qk){SES._qk=qk;el.classList.remove('qin');void el.offsetWidth;el.classList.add('qin')}else el.classList.remove('qin');
 if(ex.kind==='type'&&!ex.checked){const ti=$('#ti');if(ti)ti.focus()}
 if(ex.listen&&!ex.played&&!ex.checked){ex.played=true;say(ex.speak)}

function trackMiss(ids,ok){ids.forEach(id=>{if(ok){if(S.mistakes[id]){S.mistakes[id]--;if(S.mistakes[id]<=0)delete S.mistakes[id]}}else S.mistakes[id]=(S.mistakes[id]||0)+1})}
function check(){
 const ex=cur();if(!ex||ex.checked)return;let ok;
 if(ex.kind==='type'){const v=($('#ti')||{}).value||'';if(!v.trim())return;ex.val=v;ok=ex.answers.map(norm).includes(norm(v))}
 else if(ex.kind==='build'){ok=ex.picked.map(i=>ex.bank[i].t).join('|')===ex.tokens.join('|')}
 else{if(ex.sel==null)return;ok=ex.opts[ex.sel]===ex.answer}
 grade(ok)}
function grade(ok){
 const ex=cur();
 if(SES.mode==='mock'){
  const r=SES.sec[ex.sec||'Other']=SES.sec[ex.sec||'Other']||{c:0,t:0};r.t++;
  if(ok){r.c++;SES.hits++}else{SES.miss++;SES.wrong.push({q:ex.prompt||ex.en||'',a:ex.answer||(ex.tokens?ex.tokens.join(''):'')})}
  ex.ids.forEach(id=>srsUp(id,ok));trackMiss(ex.ids,ok);SES.done++;SES.i++;if(SES.i>=SES.q.length)finish();save();renderSession();return}
 ex.checked=true;ex.ok=ok;
 if(ex.kind==='match'){ex.ok=true;if(ex.miss)SES.miss++;else{SES.hits++;SES.first++}ex.title=ex.miss?'Matched':'Perfect match';ex.sub='';ex.ids.forEach(id=>srsUp(id,!ex.miss));SES.done++;sfx(true);save();renderSession();return}
 ex.ids.forEach(id=>srsUp(id,ok));trackMiss(ex.ids,ok);
 if(ok){SES.hits++;if(!ex.retry)SES.first++;SES.done++}
 else{SES.miss++;if(!ex.retry)SES.q.push(Object.assign({},ex,{retry:true,checked:false,ok:null,sel:null,val:'',played:false,picked:[],bank:ex.bank?ex.bank.map(b=>({t:b.t})):undefined}));else SES.done++}
 ex.title=ok?one(['Correct','Nice one','Perfect','Well done']):(ex.retry?'Keep at it':'Not quite');
 const right=ex.kind==='type'?ex.answers[0]:ex.kind==='build'?ex.tokens.join(' '):ex.answer;
 ex.sub=ok?(ex.info||''):('Answer: '+right+(ex.info&&ex.kind!=='build'?'  ·  '+ex.info:''));
 sfx(ok);save();renderSession();
 if(ex.speak)say(ex.kind==='mc'&&ex.pj?ex.speak:ex.kind==='build'?ex.speak:ex.kind==='mc'&&ex.ojp?ex.answer:ex.speak)}
function cont(){SES.i++;if(SES.i>=SES.q.length)finish();renderSession()}
function finish(){if(SES.tid){clearInterval(SES.tid);SES.tid=null}
 const att=SES.hits+SES.miss,acc=att?SES.hits/att:1;
 let xp=SES.first*5+10+(SES.miss===0?5:0);if(SES.mode==='test'&&acc<.8)xp=SES.first*3;if(SES.mode==='mock')xp=Math.round(SES.hits*1.5);
 const stars=acc>=.9?3:acc>=.75?2:1;let passed=true;
 if(SES.mode==='lesson')S.done[SES.lid]=Math.max(S.done[SES.lid]||0,stars);
 if(SES.mode==='test'){passed=acc>=.8;if(passed)UNITS[SES.ui].lessons.forEach((L,li)=>{const id=lid(SES.ui,li);S.done[id]=Math.max(S.done[id]||0,3)})}
 const lg=S.log[today()]=S.log[today()]||{l:0,r:0,w:0};if(SES.mode==='lesson')lg.l++;if(SES.mode==='practice')lg.r+=att;if(/mistake|drill/i.test(SES.title||''))lg.w++;
 award(xp);S.answered+=att;S.correct+=SES.hits;save();
 if(SES.mode==='mock'){S.mocks=(S.mocks||[]).concat({k:SES.lk||'n5',d:today(),o:Math.round(acc*100),s:Object.fromEntries(Object.entries(SES.sec).map(([k,v])=>[k,Math.round(v.c/v.t*100)]))}).slice(-10);save()}
 SES.phase='done';SES.res={xp,acc,stars,passed,secs:Math.round((Date.now()-SES.t0)/1000),sec:SES.sec,wrong:SES.wrong}}

/* progress charts */
function heatCard(){
 const t=today(),start=t-((t+3)%7)-84,cells=[];let tot=0,act=0;
 for(let d=start;d<=t+(6-((t+3)%7));d++){const xp=d>t?-1:(S.hist[d]||0);if(xp>0){tot+=xp;act++}
  const lvl=xp<=0?0:xp<15?1:xp<40?2:xp<80?3:4;
  const bg=xp<0?'transparent':lvl===0?'var(--soft)':`color-mix(in srgb,var(--pri) ${[0,28,52,76,100][lvl]}%,var(--soft))`;
  const lab=new Date(d*864e5).toLocaleDateString('en',{day:'numeric',month:'short',timeZone:'UTC'});
  cells.push(`<div class="hc" style="background:${bg}"${xp>=0?` title="${lab}: ${xp} XP"`:''}></div>`)}
 return `<div class="card"><h3>Study activity</h3><p class="mut" style="margin:4px 0 12px">${act} active day${act===1?'':'s'} in the last 13 weeks · ${tot} XP</p><div class="heat" role="img" aria-label="Study activity heatmap, ${act} active days in 13 weeks">${cells.join('')}</div><div class="legend" style="margin-top:10px">Less <i></i><i style="background:color-mix(in srgb,var(--pri) 28%,var(--soft))"></i><i style="background:color-mix(in srgb,var(--pri) 52%,var(--soft))"></i><i style="background:color-mix(in srgb,var(--pri) 76%,var(--soft))"></i><i style="background:var(--pri)"></i> More</div></div>`}
function trendCard(){
 const ms=(S.mocks||[]).slice(-10),n=ms.length;
 if(n<2)return `<div class="card"><h3>Mock exam trend</h3><p class="sub" style="margin-top:6px">Take two mock exams on the Course tab to see your trend here.${n===1?' Your first score was '+ms[0].o+'%.':''}</p></div>`;
 const W=320,H=160,L=32,R=12,T=12,B=24,x=i=>L+(W-L-R)*i/(n-1),y=v=>T+(H-T-B)*(1-v/100);
 const grid=[0,25,50,75,100].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${(y(v)+4).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--mute)">${v}</text>`).join('');
 const pts=ms.map((m,i)=>x(i).toFixed(1)+','+y(m.o).toFixed(1)).join(' ');
 const dots=ms.map((m,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(m.o).toFixed(1)}" r="${i===n-1?5:3.5}" fill="var(--pri)" stroke="var(--surface)" stroke-width="2"><title>Mock ${i+1}: ${m.o}%</title></circle>`).join('');
 const last=ms[n-1];
 return `<div class="card"><h3>Mock exam trend</h3><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Mock exam scores over time. Latest ${last.o} percent." style="margin-top:8px;max-width:460px;display:block">${grid}<line x1="${L}" x2="${W-R}" y1="${y(75).toFixed(1)}" y2="${y(75).toFixed(1)}" stroke="var(--ok)" stroke-width="1.5" stroke-dasharray="4 4"/><text x="${L+4}" y="${(y(75)-5).toFixed(1)}" font-size="10" font-weight="700" fill="var(--mute)">goal 75</text><polyline points="${pts}" fill="none" stroke="var(--pri)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}<text x="${(x(n-1)-8).toFixed(1)}" y="${(y(last.o)-9).toFixed(1)}" text-anchor="end" font-size="11" font-weight="800" fill="var(--ink)">${last.o}%</text><text x="${L}" y="${H-6}" font-size="10" fill="var(--mute)">oldest</text><text x="${W-R}" y="${H-6}" text-anchor="end" font-size="10" fill="var(--mute)">latest</text></svg><p class="mut" style="margin-top:6px">Scores: ${ms.map(m=>m.o+'%').join(', ')}</p></div>`}
